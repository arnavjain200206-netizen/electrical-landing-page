<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Warehouse with stacked PVC sheets and packaging rolls (placeholder image)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17355F"/><stop offset="1" stop-color="#0A1A33"/></linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9DB0CB"/><stop offset="1" stop-color="#6E86A8"/></linearGradient>
  </defs>
  <rect width="560" height="420" rx="18" fill="url(#bg)"/>
  <!-- grid floor -->
  <g stroke="#FFFFFF" stroke-opacity=".07">
    <line x1="0" y1="300" x2="560" y2="300"/><line x1="0" y1="340" x2="560" y2="340"/><line x1="0" y1="385" x2="560" y2="385"/>
    <line x1="140" y1="300" x2="60" y2="420"/><line x1="280" y1="300" x2="280" y2="420"/><line x1="420" y1="300" x2="500" y2="420"/>
  </g>
  <!-- racks -->
  <g fill="none" stroke="#FFB703" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="60" x2="40" y2="300"/><line x1="250" y1="60" x2="250" y2="300"/><line x1="520" y1="60" x2="520" y2="300"/>
    <line x1="40" y1="130" x2="520" y2="130"/><line x1="40" y1="215" x2="520" y2="215"/><line x1="40" y1="300" x2="520" y2="300"/>
  </g>
  <!-- top shelf: vertical sheets -->
  <g fill="url(#sheet)" stroke="#C9D5E6" stroke-width="1.5">
    <rect x="60" y="62" width="14" height="64" rx="2"/><rect x="78" y="62" width="14" height="64" rx="2"/><rect x="96" y="62" width="14" height="64" rx="2"/><rect x="114" y="62" width="14" height="64" rx="2"/><rect x="132" y="62" width="14" height="64" rx="2"/><rect x="150" y="62" width="14" height="64" rx="2"/><rect x="168" y="62" width="14" height="64" rx="2"/><rect x="186" y="62" width="14" height="64" rx="2"/><rect x="204" y="62" width="14" height="64" rx="2"/>
  </g>
  <!-- top shelf right: boxes -->
  <g fill="#C79A5A" stroke="#8C6A35" stroke-width="2">
    <rect x="272" y="84" width="90" height="42" rx="3"/><rect x="372" y="84" width="90" height="42" rx="3"/>
  </g>
  <g stroke="#8C6A35" stroke-width="2"><line x1="317" y1="84" x2="317" y2="126"/><line x1="417" y1="84" x2="417" y2="126"/></g>
  <!-- middle shelf: rolls -->
  <g>
    <rect x="62" y="160" width="46" height="52" rx="6" fill="#E9EEF6"/><ellipse cx="85" cy="160" rx="23" ry="6" fill="#FFFFFF"/>
    <rect x="116" y="160" width="46" height="52" rx="6" fill="#E9EEF6"/><ellipse cx="139" cy="160" rx="23" ry="6" fill="#FFFFFF"/>
    <rect x="170" y="160" width="46" height="52" rx="6" fill="#E9EEF6"/><ellipse cx="193" cy="160" rx="23" ry="6" fill="#FFFFFF"/>
    <rect x="272" y="170" width="60" height="42" rx="6" fill="#FFB703"/><ellipse cx="302" cy="170" rx="30" ry="7" fill="#FFD25C"/>
    <rect x="340" y="170" width="60" height="42" rx="6" fill="#FFB703"/><ellipse cx="370" cy="170" rx="30" ry="7" fill="#FFD25C"/>
    <rect x="408" y="150" width="90" height="62" rx="8" fill="#B8C6DC"/><ellipse cx="453" cy="150" rx="45" ry="9" fill="#DDE5F0"/>
  </g>
  <!-- bottom shelf: pallets of sheets -->
  <g>
    <rect x="60" y="262" width="170" height="30" rx="3" fill="url(#sheet)" stroke="#C9D5E6" stroke-width="1.5"/>
    <rect x="60" y="244" width="170" height="16" rx="3" fill="#8FA3BD" stroke="#C9D5E6" stroke-width="1.5"/>
    <rect x="60" y="294" width="170" height="6" fill="#8C6A35"/>
    <rect x="272" y="250" width="228" height="42" rx="3" fill="#C79A5A" stroke="#8C6A35" stroke-width="2"/>
    <line x1="386" y1="250" x2="386" y2="292" stroke="#8C6A35" stroke-width="2"/>
  </g>
  <!-- forklift-ish badge -->
  <g transform="translate(40 340)">
    <rect width="190" height="52" rx="12" fill="#FFB703"/>
    <text x="95" y="22" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="13" font-weight="800" fill="#0F2747">READY STOCK</text>
    <text x="95" y="40" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2747">Sheets • Films • Tapes</text>
  </g>
</svg>
