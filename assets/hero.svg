<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Stack of grey PVC sheets with packaging rolls (placeholder illustration)">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FA3BD"/><stop offset="1" stop-color="#5E7596"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D5E6"/><stop offset="1" stop-color="#9DB0CB"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EEF6"/><stop offset="1" stop-color="#B8C6DC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFB703" stop-opacity=".35"/><stop offset="1" stop-color="#FFB703" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="520" fill="none"/>
  <circle cx="320" cy="250" r="240" fill="url(#glow)"/>
  <!-- floor shadow -->
  <ellipse cx="320" cy="456" rx="250" ry="26" fill="#000" opacity=".22"/>

  <!-- PVC sheet stack (isometric) -->
  <g transform="translate(95 150)">
    <!-- side faces -->
    <polygon points="0,170 0,210 250,260 250,220" fill="#4A5F7F"/>
    <polygon points="250,220 250,260 330,225 330,185" fill="#3B4E6C"/>
    <!-- layer lines on side -->
    <g stroke="#2E4060" stroke-width="2" opacity=".8">
      <line x1="0" y1="182" x2="250" y2="232"/><line x1="0" y1="194" x2="250" y2="244"/>
      <line x1="250" y1="232" x2="330" y2="197"/><line x1="250" y1="244" x2="330" y2="209"/>
    </g>
    <!-- top face -->
    <polygon points="0,170 80,135 330,185 250,220" fill="url(#g1)"/>
    <polygon points="0,170 80,135 330,185 250,220" fill="none" stroke="#B7C6DC" stroke-width="2"/>
    <!-- peeled top sheet -->
    <polygon points="0,150 80,115 330,165 250,200" fill="url(#g2)"/>
    <polygon points="0,150 80,115 330,165 250,200" fill="none" stroke="#E9EEF6" stroke-width="2"/>
    <polygon points="0,150 0,170 250,220 250,200" fill="#7F95B3"/>
    <polygon points="250,200 250,220 330,185 330,165" fill="#6A809F"/>
    <!-- label -->
    <g transform="translate(60 168) skewY(11.3) rotate(0)">
      <rect x="0" y="0" width="120" height="30" rx="4" fill="#FFB703"/>
      <text x="60" y="20" text-anchor="middle" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" font-weight="800" fill="#0F2747">PVC SHEET</text>
    </g>
  </g>

  <!-- stretch film roll -->
  <g transform="translate(400 250)">
    <ellipse cx="62" cy="168" rx="62" ry="16" fill="#000" opacity=".18"/>
    <rect x="0" y="30" width="124" height="138" fill="url(#g3)"/>
    <ellipse cx="62" cy="168" rx="62" ry="16" fill="#C3D0E3"/>
    <ellipse cx="62" cy="30" rx="62" ry="16" fill="#F4F7FB"/>
    <ellipse cx="62" cy="30" rx="22" ry="6" fill="#8FA3BD"/>
    <ellipse cx="62" cy="30" rx="12" ry="3.5" fill="#4A5F7F"/>
    <g stroke="#FFFFFF" stroke-opacity=".6" stroke-width="3"><line x1="22" y1="60" x2="22" y2="150"/></g>
  </g>

  <!-- BOPP tape rolls -->
  <g transform="translate(470 395)">
    <ellipse cx="46" cy="30" rx="46" ry="14" fill="#000" opacity=".18"/>
    <ellipse cx="46" cy="22" rx="46" ry="14" fill="#E39A00"/>
    <rect x="0" y="8" width="92" height="14" fill="#FFB703"/>
    <ellipse cx="46" cy="8" rx="46" ry="14" fill="#FFD25C"/>
    <ellipse cx="46" cy="8" rx="20" ry="6" fill="#0F2747"/>
  </g>
  <g transform="translate(396 410)">
    <ellipse cx="38" cy="26" rx="38" ry="12" fill="#000" opacity=".18"/>
    <ellipse cx="38" cy="18" rx="38" ry="12" fill="#C9D5E6"/>
    <rect x="0" y="6" width="76" height="12" fill="#DDE5F0"/>
    <ellipse cx="38" cy="6" rx="38" ry="12" fill="#F4F7FB"/>
    <ellipse cx="38" cy="6" rx="16" ry="5" fill="#0F2747"/>
  </g>

  <!-- spark accent -->
  <path d="M120 84 98 122h16l-6 26 28-40h-17z" fill="#FFB703"/>
  <circle cx="540" cy="120" r="7" fill="#FFB703" opacity=".8"/>
  <circle cx="570" cy="160" r="4" fill="#FFB703" opacity=".6"/>
</svg>
