<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 600 610" role="img" aria-label="Stack of PVC insulation sheets stopping an electric spark">
<style>
.drop{animation:drop 1s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*.11s + .25s)}
@keyframes drop{from{transform:translateY(-170px);opacity:0}to{transform:none;opacity:1}}
.lift{animation:lift 3.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.2s + 2s)}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--i)*-2.8px))}}
.sh{animation:sh 3.8s ease-in-out 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
.bolt{animation:zap 3.6s linear 1.6s infinite;opacity:0}
@keyframes zap{0%,100%{opacity:0}2%{opacity:1}4%{opacity:.2}6%{opacity:1}12%{opacity:.8}20%{opacity:0}}
.spark{animation:zap 3.6s linear 1.6s infinite;opacity:0;transform-box:fill-box;transform-origin:center}
.ring{animation:ringx 3.6s ease-out 1.6s infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes ringx{0%{opacity:0;transform:scale(.4)}4%{opacity:.9}35%{opacity:0;transform:scale(1.25)}100%{opacity:0}}
.glowtop{animation:zap 3.6s linear 1.6s infinite;opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.bolt,.spark,.ring,.glowtop{opacity:0!important}.drop{opacity:1!important}}</style>
<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="rg"><stop offset="0" stop-color="#f0a90e" stop-opacity=".55"/><stop offset="1" stop-color="#f0a90e" stop-opacity="0"/></radialGradient></defs>
