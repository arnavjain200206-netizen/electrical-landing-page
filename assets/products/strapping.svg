<path d="M120 250v70a165 52 0 0 0 330 0v-70z" fill="url(#g8)" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
<ellipse cx="285" cy="250" rx="165" ry="52" fill="#3d6a99" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
