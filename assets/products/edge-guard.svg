<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="L-shaped edge and corner guard">
<style>
.bob{animation:bob 4.6s ease-in-out infinite}
.bob2{animation:bob 4.6s ease-in-out -2.3s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sh{animation:sh 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sh2{animation:sh 4.6s ease-in-out -2.3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(.9);opacity:.09}}
.gloss{animation:gloss 4.2s ease-in-out infinite}
@keyframes gloss{0%,35%{transform:translateX(0)}80%,100%{transform:translateX(330px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.tw{animation:tw 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}</style>
<defs></defs>
<rect width="600" height="450" fill="#e8e5de"/>
<ellipse class="sh" cx="300" cy="352" rx="190" ry="22" fill="#1c2430" opacity=".14"/>
<g class="bob"><polygon points="219.2,90.3 446.5,221.6 446.5,316.1 219.2,184.8" fill="#a98b5f" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/><polygon points="458.3,214.8 446.5,221.6 446.5,316.1 458.3,309.3" fill="#8e7249" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/><polygon points="231,83.5 458.3,214.8 446.5,221.6 219.2,90.3" fill="#cdb085" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
<polygon points="149.2,211.6 376.5,342.9 376.5,356.5 149.2,225.3" fill="#a98b5f" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/><polygon points="446.5,302.4 376.5,342.9 376.5,356.5 446.5,316.1" fill="#8e7249" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/><polygon points="219.2,171.2 446.5,302.4 376.5,342.9 149.2,211.6" fill="#cdb085" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
</g>
<path class="tw" d="M452 120l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="#f0a90e"/><path class="tw" style="animation-delay:-1.4s" d="M150 150l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f0a90e"/>
</svg>
