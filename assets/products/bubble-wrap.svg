<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Roll of air bubble wrap">
<style>
.bob{animation:bob 4.6s ease-in-out infinite}
.bob2{animation:bob 4.6s ease-in-out -2.3s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sh{animation:sh 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sh2{animation:sh 4.6s ease-in-out -2.3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh{0%,100%{transform:scale(1);opacity:.15}50%{transform:scale(.9);opacity:.09}}
.gloss{animation:gloss 4.2s ease-in-out infinite}
@keyframes gloss{0%,35%{transform:translateX(0)}80%,100%{transform:translateX(330px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.scr{animation:scr 1.8s linear infinite}@keyframes scr{to{transform:translateY(20px)}}</style>
<defs><pattern id="bub" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="8" fill="#dcebf1" fill-opacity=".9" stroke="#7fa3b3" stroke-opacity=".7" stroke-width="1"/><circle cx="7" cy="7" r="2.6" fill="#fff" fill-opacity=".95"/></pattern></defs>
<rect width="600" height="450" fill="#e8e5de"/>
<ellipse class="sh" cx="300" cy="374" rx="150" ry="20" fill="#1c2430" opacity=".14"/>
<g class="bob"><defs><linearGradient id="g7" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".3" stop-color="#fff" stop-opacity=".12"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient><clipPath id="g7c"><path d="M175 120v232a125 30 0 0 0 250 0v-232z"/></clipPath></defs>
<path d="M175 120v232a125 30 0 0 0 250 0v-232z" fill="#b9d3dd"/>
<g clip-path="url(#g7c)"><rect class="scr" x="175" y="80" width="250" height="352" fill="url(#bub)"/></g>
<g clip-path="url(#g7c)"><rect class="gloss" x="105" y="80" width="46" height="352" fill="#fff" opacity=".5" transform="skewX(-14)" style="transform-box:fill-box"/></g>
<path d="M175 120v232a125 30 0 0 0 250 0v-232z" fill="url(#g7)" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
<ellipse cx="300" cy="120" rx="125" ry="30" fill="#e4f0f4" stroke="#2b3542" stroke-opacity=".32" stroke-width="1.3" stroke-linejoin="round"/>
<g fill="none" stroke="#7fa3b3" stroke-opacity=".6" stroke-width="1.4"><ellipse cx="300" cy="120" rx="95" ry="23"/><ellipse cx="300" cy="120" rx="65" ry="15.5"/><ellipse cx="300" cy="120" rx="36" ry="8.5"/></g><ellipse cx="300" cy="120" rx="14" ry="3.5" fill="#9fb6c0"/></g>
</svg>
